            font-weight: 900;
            font-style: normal;
        }
        @font-face {
            font-family: 'Balto';
            src: url('fontes/balto-book.woff2') format('woff2');
            font-display: swap;
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'Balto';
            src: url('fontes/balto-bold.woff2') format('woff2');
            font-display: swap;
            font-weight: 700;
            font-style: normal;
        }

        :root {
            --color-dark: #0a2b35;
            --color-purple: #9f407e;
            --color-pink: #e06e87;
            --color-peach: #ff9e71;
            --color-yellow: #d3c346;
            --color-beige: #e6dbcf;
            --bg-neutral: #f8f9fa;
        }

        body {
            font-family: 'Balto', 'DM Sans', sans-serif;
            background-color: var(--bg-neutral);
            color: var(--color-dark);
            margin: 0;
            padding: 0;
        }

        .font-title {
            font-family: 'Draft Natural', 'Montserrat', sans-serif;
            text-transform: uppercase;
            letter-spacing: -0.02em;
        }

        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--color-pink); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--color-purple); }
    </style>
